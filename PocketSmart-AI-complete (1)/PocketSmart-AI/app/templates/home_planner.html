{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block protected %}true{% endblock %}{% block content %}<section class="page"><div class="container form-wrap"><div class="form-card"><span class="eyebrow">Home Interior Planner</span><h2>Build a home budget</h2><div id="message" class="message" hidden></div><form id="home-form"><div><label>Budget (₹)</label><input name="budget" type="number" min="1" required></div><div><label>Style</label><select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Contemporary</option></select></div><div><label>Rooms</label><div id="rooms"><div class="room-row"><input name="room_type" value="Living Room" required><input name="quantity" type="number" min="1" value="1"><button type="button" class="button secondary" onclick="this.parentElement.remove()">Remove</button></div></div><button type="button" class="button secondary small" onclick="addRoom()">+ Add room</button></div><div><label>Notes</label><textarea name="notes"></textarea></div><button class="button">Generate plan</button></form></div><div id="results"></div></div></section><script>function addRoom(){let d=document.createElement("div");d.className="room-row";d.innerHTML='<input name="room_type" placeholder="Bedroom" required><input name="quantity" type="number" min="1" value="1"><button type="button" class="button secondary">Remove</button>';d.querySelector("button").onclick=()=>d.remove();document.getElementById("rooms").appendChild(d)}</script>{% endblock %}
