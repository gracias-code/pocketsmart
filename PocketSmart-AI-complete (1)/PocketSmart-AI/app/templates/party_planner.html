{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block protected %}true{% endblock %}{% block content %}<section class="page"><div class="container form-wrap"><div class="form-card"><span class="eyebrow">Party Planner</span><h2>Plan your event</h2><div id="message" class="message" hidden></div><form id="party-form"><div><label>Budget (₹)</label><input name="budget" type="number" min="1" required></div><div><label>Guest count</label><input name="guest_count" type="number" min="1" required></div><div><label>Event type</label><select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Gathering</option></select></div><div><label>Venue</label><input name="venue" value="Flexible"></div><div><label>Food preference</label><select name="food_preference"><option>Mixed</option><option>Vegetarian</option><option>North Indian</option><option>South Indian</option></select></div><div><label>Notes</label><textarea name="notes"></textarea></div><button class="button">Generate plan</button></form></div><div id="results"></div></div></section>{% endblock %}
