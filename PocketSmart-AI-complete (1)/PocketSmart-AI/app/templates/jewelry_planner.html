{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block protected %}true{% endblock %}{% block content %}<section class="page"><div class="container form-wrap"><div class="form-card"><span class="eyebrow">Jewelry Planner</span><h2>Find a matching style</h2><div id="message" class="message" hidden></div><form id="jewelry-form" enctype="multipart/form-data"><div><label>Budget (₹)</label><input name="budget" type="number" min="1" required></div><div><label>Occasion</label><input name="occasion" required placeholder="Wedding, birthday, party"></div><div><label>Style</label><select name="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Statement</option></select></div><div><label>Outfit color</label><input name="outfit_color"></div><div><label>Outfit image (optional)</label><input name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></div><div><label>Notes</label><textarea name="notes"></textarea></div><button class="button">Generate recommendations</button></form></div><div id="results"></div></div></section>{% endblock %}
